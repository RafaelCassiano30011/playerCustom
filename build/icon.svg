<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1e27"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8800"/>
      <stop offset="0.55" stop-color="#e50914"/>
      <stop offset="1" stop-color="#b00610"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#2a2f3a" stroke-width="1"/>

  <!-- faixa de filme (perfuracoes) -->
  <g fill="#2a2f3a">
    <rect x="30" y="46" width="14" height="16" rx="3"/>
    <rect x="30" y="86" width="14" height="16" rx="3"/>
    <rect x="30" y="126" width="14" height="16" rx="3"/>
    <rect x="30" y="166" width="14" height="16" rx="3"/>
    <rect x="30" y="206" width="14" height="16" rx="3"/>
    <rect x="212" y="46" width="14" height="16" rx="3"/>
    <rect x="212" y="86" width="14" height="16" rx="3"/>
    <rect x="212" y="126" width="14" height="16" rx="3"/>
    <rect x="212" y="166" width="14" height="16" rx="3"/>
    <rect x="212" y="206" width="14" height="16" rx="3"/>
  </g>

  <!-- botao play -->
  <circle cx="128" cy="128" r="66" fill="#0d1017" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="66" fill="none" stroke="url(#play)" stroke-width="6"/>
  <path d="M112 98 L164 128 L112 158 Z" fill="url(#play)"/>
</svg>
